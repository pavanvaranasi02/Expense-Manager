services:
  app:
    build: .
    env_file:
      - .env
    ports:
      - "8081:8081"
      - "19000:19000"
      - "19001:19001"
      - "19002:19002"
    volumes:
      - .:/app
      - /app/node_modules
    stdin_open: true
    tty: true
    command: npx expo start --clear

  web:
    build: .
    profiles:
      - web
    env_file:
      - .env
    ports:
      - "8081:8081"
    volumes:
      - .:/app
      - /app/node_modules
    stdin_open: true
    tty: true
    command: npx expo start --web --host 0.0.0.0 --clear
